<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    path, circle { fill: #3a1c12; }
    @media (prefers-color-scheme: dark) { path, circle { fill: #f0c870; } }
    .kumkum { fill: #c8321f !important; }
  </style>
  <!-- long middle spear -->
  <path d="M32 1.5c2.6 4.4 5 9.6 5 15 0 4.3-1.8 7.4-3 10.6h-4c-1.2-3.2-3-6.3-3-10.6 0-5.4 2.4-10.6 5-15z"/>
  <!-- left prong: a crescent that ends in a sharp point -->
  <path d="M30.6 33.4c-8.4.2-15.4-2.8-17.6-10.6-1.6-5.6-.8-12.4 1.8-19.4.6 6.2 1.6 12.4 4.6 16.4 2.6 3.4 6.6 4.8 11.2 5z"/>
  <path d="M33.4 25.8c4.6-.2 8.6-1.6 11.2-5 3-4 4-10.2 4.6-16.4 2.6 7 3.4 13.8 1.8 19.4-2.2 7.8-9.2 10.8-17.6 10.6z"/>
  <!-- where the prongs meet, then a round knob -->
  <path d="M29.6 25.6h4.8l.6 8.4h-6z"/>
  <circle cx="32" cy="37.4" r="4.2"/>
  <circle class="kumkum" cx="32" cy="37.4" r="1.7"/>
  <path d="M27 42.4c3.3-.9 6.7-.9 10 0-.2 1-.6 1.6-1.4 2.1-2.4.6-4.8.6-7.2 0-.8-.5-1.2-1.1-1.4-2.1z"/>
  <!-- shaft -->
  <path d="M29.8 44.6h4.4l-.5 17.4c-1.1.5-2.3.5-3.4 0z"/>
</svg>
